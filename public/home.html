<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cellbound: Inside the Cell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-top: #1d6382;
      --bg-mid: #144363;
      --bg-deep: #0c2340;
      --mint: #43f0b6;
      --mint-dark: #169c85;
      --cyan: #3ad7ff;
      --pink: #ff7eb3;
      --pink-soft: #ffe5f0;
      --lavender: #b99aff;
      --yellow: #ffd466;
      --yellow-dark: #d99816;
      --ink-dark: #133654;
      --ink-soft: #527894;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background:
        radial-gradient(circle at 22% 28%, rgba(78, 242, 184, 0.24) 0%, transparent 42%),
        radial-gradient(circle at 80% 22%, rgba(255, 126, 179, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 30% 35%, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* Gelembung Organel Jelly di Latar Belakang */
    .bg-bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.45), rgba(78, 242, 184, 0.16) 45%, rgba(185, 154, 255, 0.08));
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: inset -4px -4px 10px rgba(58, 215, 255, 0.15);
      animation: floatBubble linear infinite;
    }

    .bubble::after {
      content: '';
      position: absolute;
      top: 18%;
      left: 20%;
      width: 24%;
      height: 14%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      transform: rotate(-30deg);
    }

    @keyframes floatBubble {
      0% {
        transform: translateY(106vh) scale(0.88);
        opacity: 0;
      }

      15% {
        opacity: 0.85;
      }

      85% {
        opacity: 0.85;
      }

      100% {
        transform: translateY(-15vh) scale(1.08);
        opacity: 0;
      }
    }

    /* Canvas 3D Cellcy */
    #cellcy-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: pointer;
    }

    /* Tombol Suara Lucu di Pojok Kanan Atas */
    .sound-toggle {
      position: fixed;
      top: 18px;
      right: 22px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink-dark);
      border: 3px solid #ffffff;
      border-radius: 999px;
      padding: 8px 15px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(19, 54, 84, 0.25), 0 10px 20px rgba(7, 22, 42, 0.25);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .sound-toggle:hover {
      transform: scale(1.06);
    }

    .sound-toggle:active {
      transform: translateY(2px) scale(0.97);
    }

    /* Layout Utama */
    .layout {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      min-height: 100vh;
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 32px;
      pointer-events: none;
    }

    /* Area Maskot & Balon Sapaan */
    .mascot-zone {
      position: relative;
      height: 86vh;
      max-height: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 14px;
    }

    .speech-bubble {
      pointer-events: auto;
      position: relative;
      background: #ffffff;
      color: var(--ink-dark);
      padding: 15px 22px 16px;
      border-radius: 30px;
      max-width: 325px;
      text-align: center;
      font-weight: 800;
      font-size: 0.97rem;
      line-height: 1.4;
      border: 3.5px solid #ffd1e6;
      box-shadow:
        0 8px 0 rgba(255, 126, 179, 0.35),
        0 16px 32px rgba(7, 22, 42, 0.32);
      animation: popBubble 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .speech-bubble:hover {
      transform: scale(1.05) rotate(-1deg);
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 15px 15px 0;
      border-style: solid;
      border-color: #ffffff transparent transparent;
    }

    .speech-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, var(--pink), #ff9ec7);
      color: #ffffff;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 999px;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
      box-shadow: 0 3px 0 #d9578d;
    }

    .tap-hint {
      background: rgba(255, 255, 255, 0.9);
      border: 2.5px solid #bdf7e4;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--ink-dark);
      box-shadow: 0 5px 0 rgba(22, 156, 133, 0.28), 0 10px 20px rgba(7, 22, 42, 0.25);
      animation: gentleBounce 2.6s ease-in-out infinite;
    }

    @keyframes gentleBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes popBubble {
      0% {
        transform: scale(0.72) translateY(12px);
        opacity: 0;
      }

      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    /* Kartu Menu Utama Gaya Marshmallow Jelly */
    .menu-card {
      pointer-events: auto;
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(242, 251, 255, 0.93) 100%);
      border: 4px solid #ffffff;
      border-radius: 40px;
      padding: 34px 30px 30px;
      backdrop-filter: blur(16px);
      box-shadow:
        0 12px 0 rgba(126, 226, 242, 0.55),
        0 26px 55px rgba(6, 20, 38, 0.48),
        inset 0 4px 12px rgba(255, 255, 255, 0.9);
    }

    /* Dekorasi Mini Organel Mengintip di Atas Kartu */
    .card-deco {
      position: absolute;
      top: -22px;
      right: 28px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }

    .deco-pill {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9ec7, var(--pink));
      border: 3px solid #ffffff;
      box-shadow: 0 4px 0 rgba(217, 87, 141, 0.35);
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      transform: rotate(10deg);
    }

    .deco-pill.mint {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #7efce0, var(--mint));
      box-shadow: 0 4px 0 rgba(22, 156, 133, 0.35);
      font-size: 0.85rem;
      transform: rotate(-12deg);
    }

    .badge-edu {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--pink-soft);
      border: 2px solid #ffc2de;
      color: #c93b76;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .game-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2.3rem, 4.2vw, 3.2rem);
      font-weight: 700;
      line-height: 1.04;
      background: linear-gradient(135deg, #0fa38c 0%, #1d8fe1 55%, #e85395 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 0 rgba(19, 54, 84, 0.1));
      margin-bottom: 6px;
    }

    .game-subtitle {
      color: var(--ink-soft);
      font-size: 0.96rem;
      font-weight: 700;
      margin-bottom: 22px;
    }

    /* Input Field Pastel dengan Ikon */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin-bottom: 22px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: #ffffff;
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      box-shadow: 0 3px 0 rgba(19, 54, 84, 0.1);
      pointer-events: none;
    }

    .input-field {
      width: 100%;
      background: #ebf8ff;
      border: 3px solid #c3ebfa;
      border-radius: 22px;
      padding: 14px 16px 14px 58px;
      color: var(--ink-dark);
      font-family: 'Nunito', sans-serif;
      font-size: 0.98rem;
      font-weight: 800;
      outline: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .input-field::placeholder {
      color: #84abc4;
      font-weight: 700;
    }

    .input-field:focus {
      background: #ffffff;
      border-color: var(--mint);
      transform: scale(1.015);
      box-shadow: 0 0 0 5px rgba(67, 240, 182, 0.25);
    }

    /* Tombol Gummy 3D Menggemaskan */
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      position: relative;
      overflow: hidden;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      border: none;
      border-radius: 24px;
      padding: 16px 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
    }

    /* Kilau Glossy di Bagian Atas Tombol */
    .btn::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 16px;
      right: 16px;
      height: 36%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.025);
    }

    .btn:active {
      transform: translateY(3px) scale(0.98);
    }

    .btn-play {
      background: linear-gradient(135deg, #52f7c1 0%, #38d9ff 100%);
      color: #073347;
      border: 2.5px solid #b8fff0;
      box-shadow: 0 8px 0 var(--mint-dark), 0 15px 26px rgba(56, 217, 255, 0.35);
    }

    .btn-play:active {
      box-shadow: 0 3px 0 var(--mint-dark), 0 8px 14px rgba(56, 217, 255, 0.25);
    }

    .btn-teacher {
      background: linear-gradient(135deg, #ffe999 0%, var(--yellow) 100%);
      color: #5c3b00;
      border: 2.5px solid #fff5cc;
      box-shadow: 0 7px 0 var(--yellow-dark), 0 12px 22px rgba(217, 152, 22, 0.25);
      font-size: 1.02rem;
      padding: 13px 20px;
    }

    .btn-teacher:active {
      box-shadow: 0 2px 0 var(--yellow-dark), 0 6px 12px rgba(217, 152, 22, 0.2);
    }

    /* Partikel Hati/Bintang Melayang Saat Cellcy Dielus */
    .floating-emote {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      font-size: 1.45rem;
      animation: emoteFloat 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes emoteFloat {
      0% {
        transform: translate(-50%, -50%) scale(0.4) rotate(-12deg);
        opacity: 0;
      }

      25% {
        opacity: 1;
      }

      100% {
        transform: translate(-50%, -145%) scale(1.25) rotate(14deg);
        opacity: 0;
      }
    }

    @media (max-width: 860px) {
      body {
        overflow-y: auto;
      }

      .layout {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 14px;
      }

      .mascot-zone {
        height: 48vh;
        min-height: 340px;
      }

      .menu-card {
        padding: 28px 22px 24px;
        border-radius: 34px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-bubbles" id="bgBubbles"></div>
  <canvas id="cellcy-canvas"></canvas>

  <button class="sound-toggle" id="soundToggle" title="Aktifkan/Matikan Efek Suara">
    <span id="soundIcon">🔊</span>
    <span id="soundLabel">SFX On</span>
  </button>

  <main class="layout">
    <section class="mascot-zone">
      <div class="speech-bubble" id="speechBubble" title="Klik untuk menyapa Cellcy!">
        <div class="speech-tag">✨ Cellcy menyapa!</div>
        <div id="speechText">Haii! 👋 Aku Cellcy! Yuk jalan-jalan ke dalam sel hari ini!</div>
      </div>
      <div class="tap-hint" id="tapHint">💖 Sentuh atau klik Cellcy untuk menyapanya!</div>
    </section>

    <section class="menu-card">
      <div class="card-deco" aria-hidden="true">
        <div class="deco-pill mint">🫧</div>
        <div class="deco-pill">🧬</div>
      </div>

      <div class="badge-edu">🌈 Petualangan Biologi 3D</div>
      <h1 class="game-title">Cellbound</h1>
      <p class="game-subtitle">Inside the Cell — Jelajahi organel lucu bersama Cellcy!</p>

      <div class="input-group">
        <div class="input-wrap">
          <span class="input-icon">🧑‍🚀</span>
          <input type="text" id="playerName" class="input-field" placeholder="Nama panggilanmu..." maxlength="18" />
        </div>
        <div class="input-wrap">
          <span class="input-icon">🏫</span>
          <input type="text" id="roomCode" class="input-field" placeholder="Kode Kelas (opsional, misal: BIO-10)"
            maxlength="12" />
        </div>
      </div>

      <div class="btn-stack">
        <button class="btn btn-play" id="btnStartStudent">
          <span>🚀</span>
          <span>Mulai Petualangan!</span>
        </button>
        <button class="btn btn-teacher" id="btnStartTeacher">
          <span>👩‍🏫</span>
          <span>Masuk Dashboard Guru</span>
        </button>
      </div>
    </section>
  </main>

  <script src="./three.min.js"></script>
  <script src="./lib/GLTFLoader.js"></script>
  <script src="./route.js"></script>

  <script>
    // 0. Efek Suara Pop Lucu via Web Audio API (tanpa file audio tambahan)
    let soundEnabled = true;
    let audioCtx = null;
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const soundLabel = document.getElementById('soundLabel');

    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
      soundLabel.textContent = soundEnabled ? 'SFX On' : 'SFX Off';
      if (soundEnabled) playCutePop(660);
    });

    function playCutePop(baseFreq = 540) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.48, now + 0.11);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      } catch (_) { }
    }

    // Efek Partikel Hati / Bintang Saat Cellcy Diklik
    const emotes = ['💖', '✨', '🫧', '⭐', '💫'];
    function spawnEmote(x, y) {
      for (let i = 0; i < 3; i++) {
        const el = document.createElement('div');
        el.className = 'floating-emote';
        el.textContent = emotes[Math.floor(Math.random() * emotes.length)];
        el.style.left = `${x + (Math.random() - 0.5) * 56}px`;
        el.style.top = `${y + (Math.random() - 0.5) * 30}px`;
        el.style.animationDelay = `${i * 0.06}s`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1050);
      }
    }

    // 1. Gelembung Latar
    const bubbleContainer = document.getElementById('bgBubbles');
    for (let i = 0; i < 18; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = Math.random() * 58 + 18;
      b.style.width = `${size}px`;
      b.style.height = `${size}px`;
      b.style.left = `${Math.random() * 100}%`;
      b.style.animationDuration = `${Math.random() * 12 + 10}s`;
      b.style.animationDelay = `${Math.random() * -18}s`;
      bubbleContainer.appendChild(b);
    }

    // 2. Dialog Sapaan Lucu
    const greetings = [
      "Haii! 👋 Aku Cellcy! Yuk jalan-jalan ke dalam sel hari ini!",
      "Halo teman! Tahukah kamu Mitokondria itu pabrik energi sel? ⚡",
      "Yuhu! Siap berburu molekul ATP bareng aku? 🧬✨",
      "Jangan lupa mampir ke Nukleus ya, pusat kendali sel ada di sana!",
      "Senang bertemu denganmu! Klik Mulai Petualangan ya! 🎉"
    ];
    let greetingIdx = 0;
    const speechBubble = document.getElementById('speechBubble');
    const speechText = document.getElementById('speechText');
    const tapHint = document.getElementById('tapHint');

    function nextGreeting() {
      greetingIdx = (greetingIdx + 1) % greetings.length;
      speechText.textContent = greetings[greetingIdx];
      speechBubble.style.animation = 'none';
      speechBubble.offsetHeight;
      speechBubble.style.animation = 'popBubble 0.45s cubic-bezier(0.34, 1.56, 0.64, 1)';
    }
    speechBubble.addEventListener('click', (e) => {
      nextGreeting();
      triggerCellcyHappy();
      spawnEmote(e.clientX, e.clientY);
      playCutePop(580);
    });

    // 3. Setup Renderer & Scene Three.js
    const canvas = document.getElementById('cellcy-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (renderer.outputEncoding !== undefined) {
      renderer.outputEncoding = THREE.sRGBEncoding;
    }
    if (THREE.ACESFilmicToneMapping !== undefined) {
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.95;
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);

    const hemiLight = new THREE.HemisphereLight(0xe6faff, 0x183c52, 0.9);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
    keyLight.position.set(2.5, 4, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x4ef2b8, 0.6);
    rimLight.position.set(-3, 2, -2);
    scene.add(rimLight);

    // Partikel Berkilau
    const sparkGeo = new THREE.BufferGeometry();
    const sparkCount = 42;
    const sparkPos = new Float32Array(sparkCount * 3);
    for (let i = 0; i < sparkCount * 3; i += 3) {
      sparkPos[i] = (Math.random() - 0.5) * 6;
      sparkPos[i + 1] = (Math.random() - 0.5) * 5;
      sparkPos[i + 2] = (Math.random() - 0.5) * 4;
    }
    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
    const sparkMat = new THREE.PointsMaterial({
      color: 0x9effe8,
      size: 0.075,
      transparent: true,
      opacity: 0.8
    });
    const sparks = new THREE.Points(sparkGeo, sparkMat);
    scene.add(sparks);

    // Wadah Karakter Cellcy
    const cellcyGroup = new THREE.Group();
    scene.add(cellcyGroup);

    let cellcyModel = null;
    let mixer = null;
    let waveRig = null;

    let wavePhase = 0;
    let currentWaveSpeed = 3.6;
    let waveEnergy = 0;
    let hopTimer = 0;
    const HOP_DURATION = 0.52;

    function getBaseY() {
      return window.innerWidth <= 860 ? 0.86 : 0.76;
    }

    function updateCellcyLayout() {
      const isMobile = window.innerWidth <= 860;
      if (isMobile) {
        cellcyGroup.position.set(0, getBaseY(), 0);
        camera.position.set(0, 0.85, 6.4);
      } else {
        cellcyGroup.position.set(-1.42, getBaseY(), 0);
        camera.position.set(0, 0.85, 6.0);
      }
    }
    updateCellcyLayout();

    function triggerCellcyHappy() {
      hopTimer = HOP_DURATION;
      waveEnergy = 1.0;
    }

    function detectRightArmRig(model) {
      model.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());

      const bones = [];
      model.traverse((obj) => {
        if (obj.isBone) bones.push(obj);
      });

      const isExcluded = (name) => /(shoulder|clavicle|collar|chest|spine|neck|head|leg|thigh|calf|foot|toe|finger|thumb|twist)/i.test(name);
      const isRightName = (name) => /(right|\.r$|_r$|r_|arm_r|armr)/i.test(name) && !/left|\.l$|_l$/i.test(name);

      let upperArm = bones.find(
        (b) => isRightName(b.name) && /(arm|upper.?arm|bicep)/i.test(b.name) && !/(fore|lower|hand)/i.test(b.name) && !isExcluded(b.name)
      );

      if (!upperArm) {
        const candidates = bones.filter((b) => {
          if (isExcluded(b.name)) return false;
          const pos = new THREE.Vector3();
          b.getWorldPosition(pos);
          const child = b.children.find((c) => c.isBone && !/twist/i.test(c.name));
          const grandChild = child ? child.children.find((c) => c.isBone && !/twist/i.test(c.name)) : null;
          return pos.x < center.x - 0.1 && pos.y > center.y && child && grandChild;
        });
        candidates.sort((a, b) => {
          const pa = new THREE.Vector3();
          const pb = new THREE.Vector3();
          a.getWorldPosition(pa);
          b.getWorldPosition(pb);
          return pa.x - pb.x;
        });
        upperArm = candidates[0] || null;
      }

      if (!upperArm) return null;

      const foreArm = upperArm.children.find((c) => c.isBone && !/twist/i.test(c.name)) || null;
      const hand = foreArm ? (foreArm.children.find((c) => c.isBone && !/twist/i.test(c.name)) || null) : null;

      return {
        upperArm,
        upperBaseQuat: upperArm.quaternion.clone(),
        foreArm,
        foreBaseQuat: foreArm ? foreArm.quaternion.clone() : null,
        hand,
        handBaseQuat: hand ? hand.quaternion.clone() : null
      };
    }

    // Muat ./models/Cellcy.glb
    const loader = new THREE.GLTFLoader();
    loader.load(
      './models/Cellcy.glb',
      (gltf) => {
        const model = gltf.scene;

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxAxis = Math.max(size.x, size.y, size.z) || 1;
        const scale = 1.92 / maxAxis;
        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));

        cellcyGroup.add(model);
        cellcyModel = model;
        tapHint.textContent = '💖 Sentuh atau klik Cellcy untuk menyapanya!';

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          const clip =
            gltf.animations.find((c) => /wave|hi|hello|greet/i.test(c.name)) ||
            gltf.animations.find((c) => /idle|breath|stand/i.test(c.name)) ||
            gltf.animations[0];
          if (clip) {
            mixer.clipAction(clip).play();
          }
        }

        waveRig = detectRightArmRig(model);
      },
      undefined,
      (err) => {
        console.error('Gagal memuat Cellcy.glb:', err);
        tapHint.textContent = '⚠️ Pastikan file public/models/Cellcy.glb tersedia';
      }
    );

    // Interaksi Mouse & Klik
    let targetRotY = 0.2;
    let targetRotX = 0;
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    window.addEventListener('pointermove', (e) => {
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      targetRotY = nx * 0.36 + 0.14;
      targetRotX = ny * 0.11;
    });

    canvas.addEventListener('click', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(cellcyGroup.children, true);
      if (hits.length > 0) {
        nextGreeting();
        triggerCellcyHappy();
        spawnEmote(e.clientX, e.clientY);
        playCutePop(520);
      }
    });

    // Animation Loop
    const clock = new THREE.Clock();
    const qModelWorld = new THREE.Quaternion();
    const qBoneWorld = new THREE.Quaternion();
    const qRot = new THREE.Quaternion();
    const modelForwardWorld = new THREE.Vector3();
    const localAxis = new THREE.Vector3();
    const pShoulder = new THREE.Vector3();
    const pElbow = new THREE.Vector3();
    const pWrist = new THREE.Vector3();
    const foreLongAxisWorld = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      if (mixer) mixer.update(delta);

      let hopOffset = 0;
      let hopTilt = 0;
      if (hopTimer > 0) {
        hopTimer = Math.max(0, hopTimer - delta);
        const progress = 1 - hopTimer / HOP_DURATION;
        hopOffset = Math.sin(progress * Math.PI) * 0.2;
        hopTilt = Math.sin(progress * Math.PI * 2) * 0.06;
      }

      waveEnergy = Math.max(0, waveEnergy - delta * 1.1);
      const targetSpeed = 3.6 + waveEnergy * 1.8;
      currentWaveSpeed += (targetSpeed - currentWaveSpeed) * Math.min(1, delta * 8);
      wavePhase += delta * currentWaveSpeed;

      const lerpFactor = Math.min(1, delta * 6);
      cellcyGroup.position.y = getBaseY() + Math.sin(elapsed * 2.2) * 0.065 + hopOffset;
      cellcyGroup.rotation.y += (targetRotY - cellcyGroup.rotation.y) * lerpFactor;
      cellcyGroup.rotation.x += (targetRotX + Math.sin(elapsed * 2.5) * 0.03 - cellcyGroup.rotation.x) * lerpFactor;
      cellcyGroup.rotation.z = Math.sin(elapsed * 2.0) * 0.035 + hopTilt;

      if (waveRig && cellcyModel) {
        const swing = Math.sin(wavePhase);

        if (!mixer) {
          waveRig.upperArm.quaternion.copy(waveRig.upperBaseQuat);
          if (waveRig.foreArm && waveRig.foreBaseQuat) waveRig.foreArm.quaternion.copy(waveRig.foreBaseQuat);
          if (waveRig.hand && waveRig.handBaseQuat) waveRig.hand.quaternion.copy(waveRig.handBaseQuat);
        }

        cellcyModel.updateMatrixWorld(true);
        cellcyModel.getWorldQuaternion(qModelWorld);
        modelForwardWorld.set(0, 0, 1).applyQuaternion(qModelWorld).normalize();

        waveRig.upperArm.getWorldQuaternion(qBoneWorld);
        localAxis.copy(modelForwardWorld).applyQuaternion(qBoneWorld.invert()).normalize();
        const upperAngle = -0.96 + swing * 0.07;
        waveRig.upperArm.quaternion.multiply(qRot.setFromAxisAngle(localAxis, upperAngle));
        waveRig.upperArm.updateMatrixWorld(true);

        if (waveRig.foreArm) {
          waveRig.foreArm.getWorldQuaternion(qBoneWorld);
          localAxis.copy(modelForwardWorld).applyQuaternion(qBoneWorld.invert()).normalize();
          const foreAngle = -0.34 + Math.sin(wavePhase - 0.35) * (0.22 + waveEnergy * 0.1);
          waveRig.foreArm.quaternion.multiply(qRot.setFromAxisAngle(localAxis, foreAngle));
          waveRig.foreArm.updateMatrixWorld(true);

          waveRig.upperArm.getWorldPosition(pShoulder);
          waveRig.foreArm.getWorldPosition(pElbow);
          foreLongAxisWorld.copy(pElbow).sub(pShoulder);
          if (foreLongAxisWorld.lengthSq() > 0.0001) {
            foreLongAxisWorld.normalize().applyAxisAngle(modelForwardWorld, foreAngle).normalize();
          } else {
            foreLongAxisWorld.set(-1, 0, 0).applyQuaternion(qModelWorld).normalize();
          }

          if (waveRig.hand) {
            waveRig.hand.getWorldPosition(pWrist);
            if (pWrist.distanceToSquared(pElbow) > 0.0001) {
              foreLongAxisWorld.copy(pWrist).sub(pElbow).normalize();
            }
          }

          const foreTwist = waveRig.hand ? 0.95 : 1.55;
          waveRig.foreArm.getWorldQuaternion(qBoneWorld);
          localAxis.copy(foreLongAxisWorld).applyQuaternion(qBoneWorld.invert()).normalize();
          waveRig.foreArm.quaternion.multiply(qRot.setFromAxisAngle(localAxis, foreTwist));
          waveRig.foreArm.updateMatrixWorld(true);
        }

        if (waveRig.hand) {
          waveRig.hand.getWorldQuaternion(qBoneWorld);
          localAxis.copy(foreLongAxisWorld).applyQuaternion(qBoneWorld.invert()).normalize();
          waveRig.hand.quaternion.multiply(qRot.setFromAxisAngle(localAxis, 0.60));
          waveRig.hand.updateMatrixWorld(true);

          waveRig.hand.getWorldQuaternion(qBoneWorld);
          localAxis.copy(modelForwardWorld).applyQuaternion(qBoneWorld.invert()).normalize();
          const handAngle = Math.sin(wavePhase - 0.7) * (0.18 + waveEnergy * 0.08);
          waveRig.hand.quaternion.multiply(qRot.setFromAxisAngle(localAxis, handAngle));
        }
      }

      sparks.rotation.y = elapsed * 0.1;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateCellcyLayout();
    });

    // 4. Navigasi ke Game / Dashboard Guru
    const nameInput = document.getElementById('playerName');
    const roomInput = document.getElementById('roomCode');

    nameInput.value = localStorage.getItem('cellbound_player_name') || '';
    roomInput.value = localStorage.getItem('cellbound_room_code') || '';

    function goToPage(targetFile) {
      playCutePop(680);
      const name = nameInput.value.trim() || 'Explorer';
      const room = roomInput.value.trim().toUpperCase() || 'PUBLIC';
      localStorage.setItem('cellbound_player_name', name);
      localStorage.setItem('cellbound_room_code', room);

      const params = new URLSearchParams({ name, room });
      if (room && room !== 'PUBLIC') {
        params.set('kode', room);
        params.set('nama', name);
        params.set('go', 'join');
      } else {
        params.set('go', 'zona1');
      }
      setTimeout(() => {
        window.location.href = `${targetFile}?${params.toString()}`;
      }, 120);
    }

    document.getElementById('btnStartStudent').addEventListener('click', () => goToPage('index.html'));
    document.getElementById('btnStartTeacher').addEventListener('click', () => goToPage('teacher.html'));
  </script>
</body>
