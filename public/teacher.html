<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CELLBOUND · Dashboard Guru</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#04141f;color:#e8fbff;font-family:system-ui,sans-serif;padding:20px}
h1{margin:0 0 4px;font-size:22px}.mut{color:#8fb7c4;font-size:13px}.card{background:#06202e;border:1px solid #1d5b70;border-radius:16px;padding:18px;margin:14px 0}
.code{font-size:56px;font-weight:800;letter-spacing:.2em;color:#4ff0d0}button{font:600 14px system-ui;background:#4ff0d0;color:#032a30;border:0;border-radius:99px;padding:10px 18px;cursor:pointer;margin:4px 6px 0 0}button.alt{background:transparent;color:#e8fbff;border:1px solid #2a7189}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid #12384a;text-align:left}.bar{height:7px;background:#12384a;border-radius:9px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4ff0d0,#ffb347)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}#cur{background:#0a3347;border-left:3px solid #ffb347;padding:10px;border-radius:8px;margin-top:10px;display:none}</style></head><body>
<h1>CELLBOUND · Dashboard Guru</h1><div class="mut" id="st">Menghubungkan ke server...</div>
<div class="card"><div class="mut">KODE KELAS</div><div class="code" id="code">-----</div><div class="mut">Siswa membuka: <b id="url"></b></div>
<div style="margin-top:10px"><button id="start">▶ Mulai Kuis Balapan</button><button class="alt" id="stop">■ Hentikan Kuis</button><button class="alt" id="reset">↺ Reset Skor</button><button class="alt" id="copy">Salin tautan</button></div><div id="cur"></div></div>
<div class="grid"><div class="card"><b>Siswa (<span id="n">0</span>)</b><table><thead><tr><th>#</th><th>Nama</th><th>Organel ditemukan</th><th>Skor</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="card"><b>Analisis soal</b><div class="mut">Soal yang sering salah muncul di sini setelah kuis berjalan.</div><table><thead><tr><th>Soal</th><th>Benar</th></tr></thead><tbody id="ls"></tbody></table></div></div>
<script>
const NM={membran:'Membran sel',sitoplasma:'Sitoplasma',nukleus:'Nukleus',nukleolus:'Nukleolus',ribosom:'Ribosom',rer:'RE kasar',rehalus:'RE halus',golgi:'Badan Golgi',vesikel:'Vesikel',mitokondria:'Mitokondria',lisosom:'Lisosom',peroksisom:'Peroksisom',sentriol:'Sentriol'};
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),strip=s=>String(s).replace(/<[^>]+>/g,'');
let ws,code=sessionStorage.cbCode||'',stats=[];
function conn(){
 const wsUrl=window.CB_WS_URL||new URLSearchParams(location.search).get('ws')||((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
 ws=new WebSocket(wsUrl);
 ws.onopen=()=>{ws.send(JSON.stringify({t:'host',code}));$('st').textContent='Terhubung.'};
 ws.onclose=()=>{$('st').textContent='Terputus. Mencoba lagi...';setTimeout(conn,2000)};
 ws.onmessage=e=>{const d=JSON.parse(e.data);
  if(d.t==='hosted'){code=d.code;sessionStorage.cbCode=code;$('code').textContent=code;const u=location.origin+'/?kode='+code;$('url').textContent=u;$('copy').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(u);stats=d.stats||[];board(d.board);ls()}
  else if(d.t==='board')board(d.board);
  else if(d.t==='err')alert(d.m);
  else if(d.t==='q'){$('cur').style.display='block';$('cur').innerHTML=`<b>Soal ${d.i+1}/${d.n}</b> (jawaban: ${NM[d.a]||d.a})<br>${strip(d.text)}`}
  else if(d.t==='qres'){stats.push(d.stat);ls();board(d.board)}
  else if(d.t==='final'){$('cur').innerHTML='<b>Kuis selesai.</b> Lihat peringkat di tabel.';board(d.board);if(d.stats){stats=d.stats;ls()}}}}
function board(b){const L=b.slice().sort((x,y)=>y.score-x.score||y.found-x.found);$('n').textContent=L.length;
 $('tb').innerHTML=L.map((p,i)=>`<tr><td>${i+1}</td><td style="color:${esc(p.color)}">${esc(p.name)}</td><td><div class="bar"><i style="width:${p.found/13*100}%"></i></div><span class="mut">${p.found}/13</span></td><td><b>${p.score}</b></td></tr>`).join('')}
function ls(){$('ls').innerHTML=stats.slice().sort((a,b)=>a.right/(a.total||1)-b.right/(b.total||1)).map(s=>`<tr><td>${esc(strip(s.text))}<div class="mut">Jawaban: ${NM[s.a]||s.a}</div></td><td>${s.right}/${s.total}</td></tr>`).join('')}
const snd=t=>ws&&ws.readyState===1&&ws.send(JSON.stringify({t}));
$('start').onclick=()=>snd('start');$('stop').onclick=()=>snd('stop');$('reset').onclick=()=>snd('reset');conn();
</script></body></html>
