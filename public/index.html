<style>

.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

</style></head><body>

<script src="three.min.js"></script><script src="lib/GLTFLoader.js"></script><script src="lib/SkeletonUtils.js"></script><script src="lib/CopyShader.js"></script><script src="lib/LuminosityHighPassShader.js"></script><script src="lib/EffectComposer.js"></script><script src="lib/RenderPass.js"></script><script src="lib/ShaderPass.js"></script><script src="lib/UnrealBloomPass.js"></script>
<script>
const $=id=>document.getElementById(id);
window.onerror=(m,s,l)=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#7a1020;color:#fff;padding:10px;border-radius:8px;font:12px monospace';d.textContent='Error: '+m+' (baris '+l+')';document.body.appendChild(d)};
const T=THREE;
function rd(){const u=Math.random()*2-1,a=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u);return new T.Vector3(s*Math.cos(a),u,s*Math.sin(a))}
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x04141f);S.fog=new T.FogExp2(0x04202e,.014);
const C=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,400);
S.add(new T.HemisphereLight(0x99ffee,0x103040,.6));
const sun=new T.DirectionalLight(0xffffff,.6);sun.position.set(10,25,10);S.add(sun);
const A=26,B=19,Y=new T.Vector3(0,1,0);
const mk=(g,c,o={})=>new T.Mesh(g,new T.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.1},o)));
// sitoplasma (lantai)
const ground=mk(new T.CircleGeometry(1,96),0x0b3b4f,{emissive:0x052233,transparent:true,opacity:.92});
ground.scale.set(A,B,1);ground.rotation.x=-Math.PI/2;ground.userData={id:'sitoplasma',ground:true};S.add(ground);
for(let i=1;i<5;i++){const r=mk(new T.RingGeometry(i/5-.004,i/5,96),0x1e7f92,{transparent:true,opacity:.25,emissive:0x1e7f92});r.scale.set(A,B,1);r.rotation.x=-Math.PI/2;r.position.y=.02;S.add(r)}
// membran: lapisan ganda fosfolipid
const N=160,heads=new T.InstancedMesh(new T.SphereGeometry(.42,10,8),new T.MeshStandardMaterial({color:0xffb36b,emissive:0x5a2a08,roughness:.4}),N*2),
tails=new T.InstancedMesh(new T.CylinderGeometry(.09,.09,.9,6),new T.MeshStandardMaterial({color:0xffe6b0}),N*2),d=new T.Object3D();
for(let i=0;i<N;i++){const t=i/N*Math.PI*2,p=new T.Vector3(A*Math.cos(t),1.1,B*Math.sin(t)),n=new T.Vector3(Math.cos(t)/A,0,Math.sin(t)/B).normalize();
 [1,-1].forEach((s,k)=>{d.quaternion.identity();d.position.copy(p).addScaledVector(n,s*1);d.updateMatrix();heads.setMatrixAt(i*2+k,d.matrix);
  d.position.copy(p).addScaledVector(n,s*.45);d.quaternion.setFromUnitVectors(Y,n);d.updateMatrix();tails.setMatrixAt(i*2+k,d.matrix)})}
heads.userData=tails.userData={id:'membran'};S.add(heads,tails);
const wall=mk(new T.CylinderGeometry(1,1,2.6,96,1,true),0x4ff0d0,{transparent:true,opacity:.1,side:T.DoubleSide,depthWrite:false,emissive:0x1a8f80});
wall.scale.set(A,1,B);wall.position.y=1.3;wall.userData={id:'membran'};S.add(wall);
// kanal protein
const ca=3.5,cp=new T.Vector3(A*Math.cos(ca),1.1,B*Math.sin(ca)),cn=new T.Vector3(Math.cos(ca)/A,0,Math.sin(ca)/B).normalize();
const chan=new T.Group();const cb=mk(new T.CylinderGeometry(1,1.1,3.2,20,1,true),0xff5fa2,{emissive:0x6a1040,side:T.DoubleSide});
const cr=mk(new T.TorusGeometry(1,.22,10,24),0xffa6d0,{emissive:0xaa3070});cr.rotation.x=Math.PI/2;cr.position.y=1.6;chan.add(cb,cr);
chan.position.copy(cp);chan.quaternion.setFromUnitVectors(Y,cn);chan.userData={id:'membran'};S.add(chan);
// nukleus
const NC=new T.Vector3(7,3,-2),nuc=new T.Group();nuc.position.copy(NC);nuc.userData={id:'nukleus'};
const sg=new T.SphereGeometry(5.5,64,40),pa=sg.attributes.position,v=new T.Vector3();
for(let i=0;i<pa.count;i++){v.fromBufferAttribute(pa,i);const k=1+.04*Math.sin(v.x*1.3)*Math.cos(v.y*1.7+v.z);v.multiplyScalar(k);pa.setXYZ(i,v.x,v.y,v.z)}sg.computeVertexNormals();
const shell=mk(sg,0x8a6bff,{transparent:true,opacity:.4,emissive:0x2a1a77,depthWrite:false,roughness:.2});
const shell2=mk(new T.SphereGeometry(5.75,32,20),0xb7a3ff,{transparent:true,opacity:.12,wireframe:true,depthWrite:false});
nuc.add(shell,shell2);
for(let i=0;i<34;i++){const dir=rd(),p=mk(new T.TorusGeometry(.3,.09,8,14),0xffe27a,{emissive:0x886a10});p.position.copy(dir).multiplyScalar(5.55);p.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),dir);nuc.add(p)}
const chro=mk(new T.TorusKnotGeometry(2.6,.12,220,8,3,5),0xff7ad9,{emissive:0x8a2a70});nuc.add(chro);
const nucleolus=mk(new T.SphereGeometry(1.5,32,24),0xff9d3c,{emissive:0x9a4a08,roughness:.6});nucleolus.position.set(.9,.2,.6);nucleolus.userData={id:'nukleolus'};nuc.add(nucleolus);
const nl=new T.PointLight(0xff9d3c,.8,10);nl.position.copy(nucleolus.position);nuc.add(nl);S.add(nuc);
// gugus sitosol (enzim)
const SP=new T.Vector3(-11,1.6,6),clus=new T.Group();clus.position.copy(SP);clus.userData={id:'sitoplasma'};
for(let i=0;i<16;i++){const m=mk(new T.IcosahedronGeometry(.28+Math.random()*.25,1),i%2?0x6bffb0:0x4ff0d0,{emissive:0x138a6a});m.position.copy(rd()).multiplyScalar(1+Math.random()*1.6);m.userData.ph=Math.random()*6;clus.add(m)}
const cl=new T.PointLight(0x4ff0d0,1,12);clus.add(cl);S.add(clus);
// partikel sitosol
const PN=450,pg=new T.BufferGeometry(),pp=new Float32Array(PN*3),ps=[];
for(let i=0;i<PN;i++){const a=Math.random()*6.28,r=Math.sqrt(Math.random());pp.set([Math.cos(a)*r*A,.3+Math.random()*5,Math.sin(a)*r*B],i*3);ps.push(Math.random()*6)}
pg.setAttribute('position',new T.BufferAttribute(pp,3));S.add(new T.Points(pg,new T.PointsMaterial({color:0x9ffff0,size:.14,transparent:true,opacity:.6,depthWrite:false})));
// pemain: karakter 3D (Cellcy.glb) — probe dipakai sebagai cadangan sebelum model termuat
const P=new T.Group(),probe=new T.Group();
const core=mk(new T.IcosahedronGeometry(.5,2),0x4ff0d0,{emissive:0x22d0b0,emissiveIntensity:1.2}),ring=mk(new T.TorusGeometry(.85,.05,8,40),0xffffff,{emissive:0xffffff});
ring.rotation.x=Math.PI/2;probe.add(core,ring);P.add(probe);
const charLight=new T.PointLight(0xbdfff4,.8,15);charLight.position.set(0,3.6,1.2);P.add(charLight);
P.position.set(-4,0,10);S.add(P);
const vel=new T.Vector3();let target=null;
// objek interaktif
const IT=[],LBL=$('lbls');
function add(o){IT.push(o);o.found=false;
 o.beam=new T.Mesh(new T.CylinderGeometry(.12,.12,14,8,1,true),new T.MeshBasicMaterial({color:0xffb347,transparent:true,opacity:.35,depthWrite:false}));o.beam.position.set(o.pos.x,7,o.pos.z);
 o.rg=new T.Mesh(new T.TorusGeometry(o.rr,.08,8,48),new T.MeshBasicMaterial({color:0xffb347,transparent:true,opacity:.7}));o.rg.rotation.x=Math.PI/2;o.rg.position.set(o.pos.x,.06,o.pos.z);
 S.add(o.beam,o.rg);o.el=document.createElement('div');o.el.className='lbl';o.el.textContent=o.name;LBL.appendChild(o.el);
 o.bs=[o.beam];o.rs=[o.rg];(o.pts||[]).slice(1).forEach(p=>{const b=o.beam.clone(),r=o.rg.clone();b.position.set(p.x,7,p.z);r.position.set(p.x,.06,p.z);S.add(b,r);o.bs.push(b);o.rs.push(r)});if(o.need){o.beam.visible=o.rg.visible=false}}
add({id:'membran',name:'Membran Sel',pos:cp,range:6,rr:3.2,ly:3.5,tag:'GERBANG SELEKTIF',
 body:'Tersusun dari <b>lapisan ganda fosfolipid</b> dengan protein tertanam. Bersifat <b>selektif permeabel</b>: mengatur zat yang masuk dan keluar lewat difusi, osmosis, transpor aktif, dan kanal protein (yang berwarna pink di dekatmu).',
 fact:'Kepala fosfolipid bersifat hidrofilik (suka air) dan ekornya hidrofobik, sehingga ekor saling berhadapan di bagian dalam. Model ini disebut <b>mosaik cair</b>.'});
add({id:'sitoplasma',name:'Sitoplasma',pos:SP,range:5,rr:3,ly:4,tag:'ARENA KEHIDUPAN SEL',
 body:'Cairan <b>sitosol</b> berisi air, ion, enzim, dan molekul organik, tempat organel tersebar. Banyak reaksi metabolisme, misalnya <b>glikolisis</b>, berlangsung di sini.',
 fact:'Sitoplasma tidak diam: aliran sitoplasma (siklosis) membantu mendistribusikan zat ke seluruh sel.'});
add({id:'nukleus',name:'Nukleus (Inti Sel)',pos:NC,range:9.5,rr:6.9,ly:7.5,tag:'PUSAT KENDALI',
 body:'Menyimpan <b>materi genetik (DNA)</b> dalam bentuk kromatin dan mengendalikan aktivitas sel, termasuk pembelahan sel dan sintesis protein. Selubung intinya berpori untuk lalu lintas RNA dan protein.',
 fact:'Pada sel eukariotik DNA terlindungi di dalam nukleus, berbeda dengan sel prokariotik yang tidak punya inti sejati. <b>Pori inti terbuka</b>: kamu bisa masuk sekarang!'});
add({id:'nukleolus',name:'Nukleolus (Anak Inti)',pos:new T.Vector3().copy(NC).add(nucleolus.position),range:3.4,rr:1.9,ly:3.5,need:'nukleus',tag:'PABRIK RIBOSOM',
 body:'Tempat sintesis <b>rRNA</b> dan perakitan <b>subunit ribosom</b>. Subunit diekspor lewat pori inti ke sitoplasma lalu bergabung menjadi ribosom yang siap membuat protein.',
 fact:'Sel yang sangat aktif membuat protein biasanya memiliki nukleolus yang lebih besar dan menonjol.'});
// ===== ISI SEL LENGKAP (dekor + teaser Zona 2 & 3) =====
const DEC=[],ANI=[],VS=[],PK=[],dm=(c,e,o={})=>mk(new T.SphereGeometry(1,24,16),c,Object.assign({emissive:e,transparent:true,opacity:.9},o));
function dlabel(){}
const ribM=new T.MeshStandardMaterial({color:0xffd34d,emissive:0x6a4a00});
// ribosom bebas
const rib=new T.InstancedMesh(new T.SphereGeometry(.17,8,6),ribM,140),od=new T.Object3D();
for(let i=0;i<140;i++){let x,z;do{const a=Math.random()*6.28,r=Math.sqrt(Math.random());x=Math.cos(a)*r*(A-3);z=Math.sin(a)*r*(B-3)}while(Math.hypot(x-NC.x,z-NC.z)<6.5);od.position.set(x,.3+Math.random()*2.5,z);od.updateMatrix();rib.setMatrixAt(i,od.matrix)}
S.add(rib);dlabel('Ribosom · Zona 2',-6,2,2.2);
// RE kasar
const rer=new T.Group();rer.position.set(-2,0,-7);
for(let i=0;i<6;i++){const s=dm(0x5fa8ff,0x143a77,{opacity:.85});s.scale.set(3.4-i*.1,.22,1.8);s.position.set(Math.sin(i)*.3,.5+i*.5,0);s.rotation.y=i*.12;rer.add(s);
 for(let j=0;j<14;j++){const r=new T.Mesh(new T.SphereGeometry(.13,6,5),ribM);r.position.set((Math.random()*2-1)*2.4,.5+i*.5+.22,(Math.random()*2-1)*1.2);rer.add(r)}}
S.add(rer);dlabel('Retikulum Endoplasma Kasar · Zona 2',-2,-7,4.4);
// RE halus
for(let k=0;k<3;k++){const pts=[];for(let i=0;i<7;i++)pts.push(new T.Vector3(-5-i*1.6-Math.random(),.6+Math.random()*1.4,-3+k*2.2+Math.sin(i*1.7+k)*1.4));
 S.add(mk(new T.TubeGeometry(new T.CatmullRomCurve3(pts),60,.22,8,false),0x8fd0ff,{emissive:0x1a4a77,transparent:true,opacity:.85}))}
dlabel('Retikulum Endoplasma Halus',-10,-1,2.8);
// Golgi
const gol=new T.Group();gol.position.set(-12,0,-10);
for(let i=0;i<5;i++){const s=dm(0xff8a5c,0x7a2a10,{opacity:.9});s.scale.set(3-Math.abs(i-2)*.3,.2,1.3);s.position.y=.6+i*.55;s.rotation.z=(i-2)*.05;gol.add(s)}
S.add(gol);dlabel('Badan Golgi · Zona 2',-12,-10,4.6);
// vesikel (RER -> Golgi -> membran)
const vP=[new T.Vector3(-2,1.4,-7),new T.Vector3(-12,1.4,-10),new T.Vector3(-19,1.5,-10)];
for(let i=0;i<12;i++){const m=new T.Mesh(new T.SphereGeometry(.34,14,10),new T.MeshStandardMaterial({color:i<6?0xbfe8ff:0xfff0a0,emissive:i<6?0x2a6a8a:0x8a7010,transparent:true,opacity:.85}));m.userData={s:i<6?0:1,o:Math.random()};S.add(m);VS.push(m)}
dlabel('Vesikel · Zona 2',-7,-8.5,3);
// mitokondria
function mito(x,z,ry){const g=new T.Group(),o=dm(0xff5a3c,0x5a1608,{opacity:.55});o.scale.set(2.1,.9,.9);g.add(o);
 for(let i=0;i<6;i++){const c=mk(new T.TorusGeometry(.6,.07,6,16),0xffb08a,{emissive:0x7a3010});c.rotation.y=Math.PI/2;c.position.x=-1.3+i*.52;g.add(c)}
 g.position.set(x,1,z);g.rotation.y=ry;g.userData.ph=Math.random()*6;S.add(g);ANI.push(g);dlabel('Mitokondria · Zona 3',x,z,3)}
[[14,8,.4],[18,-6,1.2],[-4,13,2.4],[10,-12,.9],[-17,10,.2]].forEach(p=>mito(...p));
// lisosom
function liso(x,z){const g=new T.Group(),o=dm(0xb6ff4a,0x3a6a08,{opacity:.6});o.scale.setScalar(.85);g.add(o);
 for(let i=0;i<7;i++){const s=new T.Mesh(new T.SphereGeometry(.14,6,5),new T.MeshStandardMaterial({color:0x2a3a10}));s.position.copy(rd()).multiplyScalar(.45);g.add(s)}
 g.position.set(x,.9,z);g.userData.ph=Math.random()*6;S.add(g);ANI.push(g);dlabel('Lisosom · Zona 3',x,z,2.6)}
[[20,2],[22,-3],[12,14],[17,-11]].forEach(p=>liso(...p));
// peroksisom
function pero(x,z){const g=new T.Group(),o=dm(0xd9a066,0x4a2a08,{opacity:.55});o.scale.setScalar(.7);g.add(o);
 g.add(mk(new T.DodecahedronGeometry(.28),0x3a2a1a,{emissive:0x1a0a00}));g.position.set(x,.8,z);g.userData.ph=Math.random()*6;S.add(g);ANI.push(g);dlabel('Peroksisom · Zona 3',x,z,2.4)}
[[-16,-3],[4,10],[-5,9],[1,-14]].forEach(p=>pero(...p));
// sentriol + mikrotubulus
const cen=new T.Group();cen.position.set(1,.9,6.5);
[0,1].forEach(i=>{const c=mk(new T.CylinderGeometry(.22,.22,1.1,12),0xe6e6ff,{emissive:0x333366});if(i){c.rotation.z=Math.PI/2;c.position.z=.8}cen.add(c)});S.add(cen);dlabel('Sentriol & Sitoskeleton',1,6.5,2.6);
const mp=[];for(let i=0;i<30;i++){const a=Math.random()*6.28,r=5+Math.random()*9;mp.push(1,.5,6.5,1+Math.cos(a)*r*1.2,.3+Math.random()*1.5,6.5+Math.sin(a)*r*.6)}
const mg=new T.BufferGeometry();mg.setAttribute('position',new T.Float32BufferAttribute(mp,3));S.add(new T.LineSegments(mg,new T.LineBasicMaterial({color:0x6fc3d6,transparent:true,opacity:.3})));
function decor(t){for(const g of ANI){g.position.y+=Math.sin(t*1.5+g.userData.ph)*.003;g.rotation.y+=.002}
